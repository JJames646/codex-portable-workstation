<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex 便携工作站 UI 原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-label="Codex 图标">
            <svg viewBox="0 0 48 48" role="img" aria-hidden="true">
              <path d="M24 5.5 39.8 14.7v18.6L24 42.5 8.2 33.3V14.7L24 5.5Z" />
              <path d="M24 13.2 33.1 18.5v10.9L24 34.8 14.9 29.4V18.5L24 13.2Z" />
              <path d="M24 5.5v7.7m15.8 1.5-6.7 3.8M8.2 14.7l6.7 3.8M24 42.5v-7.7m15.8-1.5-6.7-3.9M8.2 33.3l6.7-3.9" />
            </svg>
          </div>
          <div>
            <div class="brand-name">Codex 便携工作站</div>
            <div class="brand-subtitle">您的移动工作站</div>
          </div>
        </div>

        <nav class="nav-list" aria-label="主导航">
          <button class="nav-item active" data-page="home">
            <span class="nav-icon">⌘</span>
            <span>首页</span>
          </button>
          <button class="nav-item" data-page="providers">
            <span class="nav-icon">◇</span>
            <span>供应商配置</span>
          </button>
          <button class="nav-item" data-page="projects">
            <span class="nav-icon">▣</span>
            <span>项目管理</span>
          </button>
          <button class="nav-item" data-page="sessions">
            <span class="nav-icon">◌</span>
            <span>会话与绘画</span>
          </button>
          <button class="nav-item" data-page="tools">
            <span class="nav-icon">✦</span>
            <span>工具与插件</span>
          </button>
          <button class="nav-item" data-page="enhance">
            <span class="nav-icon">⌗</span>
            <span>页面增强</span>
          </button>
          <button class="nav-item" data-page="zed">
            <span class="nav-icon">↗</span>
            <span>Zed 远程项目</span>
          </button>
          <button class="nav-item" data-page="data">
            <span class="nav-icon">◈</span>
            <span>数据与备份</span>
          </button>
          <button class="nav-item" data-page="network">
            <span class="nav-icon">⇄</span>
            <span>网络环境配置</span>
          </button>
          <button class="nav-item has-dot" data-page="updates">
            <span class="nav-icon">↑</span>
            <span>更新中心</span>
          </button>
          <button class="nav-item" data-page="maintenance">
            <span class="nav-icon">⌁</span>
            <span>安装维护</span>
          </button>
          <button class="nav-item" data-page="settings">
            <span class="nav-icon">⚙</span>
            <span>设置</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="usb-pill">
            <span class="pulse-dot"></span>
            U盘模式已挂载
          </div>
          <button class="ghost-button" id="safeEjectFromSide">弹出 U盘</button>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="crumb">Codex Portable Workstation</p>
            <h1 id="pageTitle">首页</h1>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" title="切换主题" id="themeToggle">◐</button>
            <button class="soft-button" id="quickCheck">重新检测</button>
            <button class="primary-button" id="launchCodex">启动 Codex</button>
            <button class="stop-button" id="stopCodex" disabled>停止</button>
            <button class="ghost-button" id="safeEjectTop" disabled>弹出 U盘</button>
          </div>
        </header>

        <div id="content" class="content" aria-live="polite"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="modal-backdrop" id="factoryModal" aria-hidden="true">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="factoryTitle">
        <div class="modal-header">
          <div>
            <p class="eyebrow danger">危险操作</p>
            <h2 id="factoryTitle">恢复出厂设置</h2>
          </div>
          <button class="icon-button" id="closeFactory">×</button>
        </div>
        <p class="muted">
          此操作会永久删除工作站设置、卡密授权、API Key、供应商、项目、历史会话、绘画、插件、Skills、备份和缓存，并恢复到首次出厂状态。
        </p>
        <label class="check-line">
          <input id="factoryAgree" type="checkbox" />
          <span>我已了解所有移动工作站数据都会被永久删除且无法恢复</span>
        </label>
        <label class="field" style="margin-top:14px;">
          <span>请输入“恢复出厂设置”进行最终确认</span>
          <input id="factoryConfirmText" autocomplete="off" placeholder="恢复出厂设置" />
        </label>
        <div class="modal-actions">
          <button class="ghost-button" id="cancelFactory">取消</button>
          <button class="danger-button" id="confirmFactory">永久删除并恢复</button>
        </div>
      </section>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
